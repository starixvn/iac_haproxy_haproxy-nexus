

backend novastar_hrm_nex_bio_webapi_NEXAWS_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template hrm_nex_bio_webapi_NEXAWS_ 1 hrm_nex_bio_webapi_NEXAWS:5000 check resolvers docker init-addr none

