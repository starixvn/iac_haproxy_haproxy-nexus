backend nexcel_simpleapi_NEXAWS_be
    option forwardfor
    option http-server-close
    option httpchk GET /healthz
    http-check expect status 200
    cookie serverid insert
    server-template nexcel_simpleapi_NEXAWS_ 1 nexcel_simpleapi_NEXAWS:5000 resolvers docker init-addr none check

