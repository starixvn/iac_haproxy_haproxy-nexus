backend nexus_nexcel_redmine_NEXAWS_be
    option forwardfor
    option http-server-close
    #option httpchk GET /login
    http-check expect status 200
    cookie serverid insert
    server-template nexcel_redmine_NEXAWS_ 1 nexcel_redmine_NEXAWS:80 resolvers docker init-addr none check
