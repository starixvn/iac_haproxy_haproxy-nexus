backend nexcel_info_site_NEXAWS_be
    redirect scheme https if !{ ssl_fc }
    option forwardfor
    option http-server-close
    option httpchk HEAD /readme.html
    http-check expect status 200
    cookie serverid insert
    server-template nexcel_info_site_NEXAWS_ 2 nexcel_info_site_NEXAWS:80 check resolvers docker init-addr none
