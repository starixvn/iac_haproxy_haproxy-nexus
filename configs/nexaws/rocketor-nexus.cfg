backend nexus_nexcel_nexbot_NEXAWS_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template nexcel_nexbot_NEXAWS_ 1 nexcel_nexbot_NEXAWS:5000 check resolvers docker init-addr none

