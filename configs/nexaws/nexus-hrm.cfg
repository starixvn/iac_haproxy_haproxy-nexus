backend nexcel_nexhrm_NEXAWS_be
    redirect scheme https if !{ ssl_fc }
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami
    http-check expect status 200
    cookie serverid insert
    server-template nexcel_nexhrm_NEXAWS_ 2 nexcel_nexhrm_NEXAWS:5000 check resolvers docker init-addr none

backend nexcel_nexhrm_NEXAWS_1_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template nexcel_nexhrm_NEXAWS_1_ 1 nexcel_nexhrm_NEXAWS_1:5000 check resolvers docker init-addr none
