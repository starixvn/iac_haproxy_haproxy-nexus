backend nexus_nexcel_info_site_NEXPROD_be
    redirect scheme https if !{ ssl_fc }
    option forwardfor
    log global
    option httplog
    option http-server-close
    option httpchk HEAD /readme.html
    http-check expect status 200
    cookie serverid insert
    server-template nexus_nexcel_info_site_ 2 nexcel_info_site_NEXPROD:80 check resolvers docker init-addr none
