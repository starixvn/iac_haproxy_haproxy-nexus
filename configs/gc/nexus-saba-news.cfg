backend nexus_saba_sports_saba_news_site_GC_be
    #http-request redirect scheme https unless { ssl_fc }
    #http-request redirect prefix https://www.%[hdr(host)] code 301 unless { hdr_beg(host) -i www. }
    #http-request redirect prefix https://%[hdr(host),regsub(^www\.,,i)] code 301 if { hdr_beg(host) -i www. }
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami
    http-check expect status 200
    cookie serverid insert
    server-template nexus_saba_sports_saba_news_site_GC 2 saba_sports_saba_news_site_GC:5000 check resolvers docker init-addr none

