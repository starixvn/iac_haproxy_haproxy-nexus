backend nexus_saba_sports_saba_news_wp_GC_be
    option http-server-close
    option httpchk HEAD /readme.html
    http-check expect status 200
    cookie serverid insert
    server-template nexus_saba_sports_saba_news_wp_GC 2 saba_sports_saba_news_wp_GC:80 check resolvers docker init-addr none

backend nexus_saba_sports_saba_news_upload_GC_be
