frontend nexus_saba_news_PROD
    bind *:7516
    mode  http
    #http-request redirect scheme https unless { ssl_fc }
    #http-request redirect scheme https if { hdr(host) -i saba.vn }
    #http-request redirect scheme https if { hdr_dom(host) -m end saba.vn }
    #http-request redirect code 301 location https://www.saba.vn%[capture.req.uri] if { hdr_dom(host) -m end saba.vn }
    #redirect scheme https if !{ ssl_fc }
    #http-request set-header X-Forwarded-Proto https if { ssl_fc }
    #redirect scheme https code 301 if !{ ssl_fc }
    http-request redirect code 301 location https://www.saba.vn%[capture.req.uri] if { hdr_dom(host) -m end vn.sabasports.com }

    use_backend nexus_saba_news_nodes_PROD

backend nexus_saba_news_nodes_PROD
    #http-request redirect scheme https unless { ssl_fc }
    #http-request redirect prefix https://www.%[hdr(host)] code 301 unless { hdr_beg(host) -i www. }
    #http-request redirect prefix https://%[hdr(host),regsub(^www\.,,i)] code 301 if { hdr_beg(host) -i www. }
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami
    http-check expect status 200
    cookie serverid insert
    server-template nexus_saba_sports_saba_news_site_PROD 2 saba_sports_saba_news_site_PROD:5000 check resolvers docker init-addr none

frontend nexus_saba_news_wp_PROD
    bind *:7515
    mode  http
    use_backend saba_sports_saba_news_wp_nodes_PROD

backend saba_sports_saba_news_wp_nodes_PROD
     option http-server-close
     option httpchk HEAD /readme.html
     http-check expect status 200
     cookie serverid insert
     server-template nexus_saba_sports_saba_news_wp_PROD 2 saba_sports_saba_news_wp_PROD:80 check resolvers docker init-addr none
     
frontend nexus_saba_news_upload_PROD
    bind *:7519
    mode  http
    use_backend nexus_saba_news_upload_nodes_PROD

 backend nexus_saba_news_upload_nodes_PROD
     option forwardfor
