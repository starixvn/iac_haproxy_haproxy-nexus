

backend nexus_nap_crm_website_UAT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET GET /whoami
    http-check expect status 200
    server-template nap_crm_website_UAT_ 2 nap_crm_website_UAT:5000 check resolvers docker init-addr none

backend nexus_nap_crm_website_UAT_path_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET GET /whoami
    http-check expect status 200
    http-request set-path %[path,lower,regsub(^/v1[/]?,/)]
    server-template nap_crm_website_UAT_ 2 nap_crm_website_UAT:5000 check resolvers docker init-addr none
