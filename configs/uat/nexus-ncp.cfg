backend nexus_ncb_main_UAT_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template chatbot_ncb_main_UAT_ 1 chatbot_ncb_main_UAT:5000 check resolvers docker init-addr none

backend nexus_ncb_endpoint_UAT_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template chatbot_ncb_service_endpoint_UAT_ 1 chatbot_ncb_service_endpoint_UAT:5000 check resolvers docker init-addr none
