backend nexus_saba_news_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nexus_saba_sports_saba_news_site_AWS_ 2 saba_sports_saba_news_site_AWS:5000 check resolvers docker init-addr none
    
backend nexus_saba_sports_saba_news_wp_nodes
     option http-server-close
     option httpchk GET /readme.html
     http-check expect status 200
     cookie serverid insert
     server-template nexus_saba_sports_saba_news_wp_AWS_ 2 saba_sports_saba_news_wp_AWS:80 check resolvers docker init-addr none
     
 backend nexus_saba_news_upload_nodes
     option forwardfor
     option http-server-close
     option httpchk GET /whoami
     http-check expect status 200
     cookie serverid insert
     server-template nexus_saba_sports_saba_news_upload_AWS_ 1 saba_sports_saba_news_upload_AWS:80 check resolvers docker init-addr none
