backend nexus_chatbot_ncb_main_SIT_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template chatbot_ncb_main_SIT_ 2 chatbot_ncb_main_SIT:5000 check resolvers docker init-addr none

backend nexus_chatbot_ncb_service_endpoint_SIT_be
