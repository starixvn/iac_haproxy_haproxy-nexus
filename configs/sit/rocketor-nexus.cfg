

backend nexus_nap_crm_letstalk_webhook_SIT_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template nap_crm_letstalk_webhook_SIT_ 2 nap_crm_letstalk_webhook_SIT:5000 check resolvers docker init-addr none

