

backend novastar_hrm_go_system_LOCAL_1_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template hrm_go_system_LOCAL_1_ 1 hrm_go_system_LOCAL_1:5000 check resolvers docker init-addr none

