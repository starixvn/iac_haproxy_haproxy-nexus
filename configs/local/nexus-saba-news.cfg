backend nexus_saba_sports_saba_news_site
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami
    http-check expect status 200
    cookie serverid insert
    server-template nexus_saba_sports_saba_news_site_ 2 saba_sports_saba_news_site_LOCAL:5000 check resolvers docker init-addr none

backend nexus_saba_sports_saba_news_site_1
    http-request redirect scheme https unless { ssl_fc }
    option forwardfor
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    cookie serverid insert
    server-template saba_sports_saba_news_site_LOCAL_1_ 2 saba_sports_saba_news_site_LOCAL_1:5000 check resolvers docker init-addr none
