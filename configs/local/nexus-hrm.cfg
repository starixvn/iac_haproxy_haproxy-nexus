backend nexus_smshrm_website_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    #option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template smshrm_website_LOCAL_ 1 smshrm_website_LOCAL:80 check resolvers docker init-addr none

backend nexus_nexcel_nexhrm_LOCAL_be
