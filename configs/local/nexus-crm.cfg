
backend nexus_nap_crm_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server-template nexus_nap_crm_nodes1_ 1 10.18.200.202:7501 check
    server-template nexus_nap_crm_nodes2_ 1 10.18.200.209:7501 check

