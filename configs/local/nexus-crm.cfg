backend nexus_nap_crm_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server 10.18.200.202_7501 10.18.200.202:7501 check
    server 10.18.200.209_7501 10.18.200.209:7501 check

