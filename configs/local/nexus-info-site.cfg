backend nexus_nexcel_info_site
    redirect scheme https if !{ ssl_fc }
    option forwardfor
    option http-server-close
    option httpchk HEAD /readme.html
    http-check expect status 200
    cookie serverid insert
    server-template nexus_nexcel_info_site_ 2 nexcel_info_site_LOCAL:80 check resolvers docker init-addr none
