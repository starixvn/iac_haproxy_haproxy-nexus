backend nexus_redmine_nodes_LOCAL
    option forwardfor
    option http-server-close
    option httpchk GET /login
    http-check expect status 200
    cookie serverid insert
    server-template nexcel_redmine_LOCAL_ 1 nexcel_redmine_LOCAL:80 resolvers docker init-addr none check

backend nexus_redmine_nodes_PROD
    redirect scheme https if !{ ssl_fc }
    option forwardfor
    option http-server-close
    option httpchk GET /login
    http-check expect status 200
    cookie serverid insert
    server-template nexcel_redmine_LOCAL_1_ 2 nexcel_redmine_LOCAL_1:80 resolvers docker init-addr none check

backend nexus_redmine_nodes_PROD_bk
    option forwardfor
    option http-server-close
    option httpchk GET /login
    http-check expect status 200
    cookie serverid insert
    server-template nexcel_redmine_bk 1 10.18.200.109:8084 resolvers docker init-addr none check
