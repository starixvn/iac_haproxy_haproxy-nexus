backend nexus_chatbot_ncb_main_LOCAL_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template chatbot_ncb_main_LOCAL_ 2 chatbot_ncb_main_LOCAL:5000 check resolvers docker init-addr none

