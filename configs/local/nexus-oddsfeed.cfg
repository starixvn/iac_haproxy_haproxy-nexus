
backend nexus_oddsfeed_admin_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server-template nexus_oddsfeed_admin_nodes1_ 1 10.18.200.202:7530 check
    server-template nexus_oddsfeed_admin_nodes2_ 1 10.18.200.209:7530 check

