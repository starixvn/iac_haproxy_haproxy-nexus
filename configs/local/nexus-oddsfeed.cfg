backend nexus_xml_oddsfeed_webservice_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    cookie serverid insert
    server-template xml_oddsfeed_webservice_LOCAL_ 1 xml_oddsfeed_webservice_LOCAL:80 check resolvers docker init-addr none

backend nexus_xml_oddsfeed_admin_site_LOCAL_be
    option forwardfor
    timeout server 10m
    option http-server-close
    #option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template xml_oddsfeed_admin_site_LOCAL_ 1 xml_oddsfeed_admin_site_LOCAL:80 check resolvers docker init-addr none
