backend nexus_thor_api_LOCAL
    option forwardfor
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    cookie serverid insert
    server-template thor_thor_api_LOCAL_ 1 thor_thor_api_LOCAL:5000 check resolvers docker init-addr none

