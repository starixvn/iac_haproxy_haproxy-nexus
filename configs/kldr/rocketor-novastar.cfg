

backend novastar_hrm_group_hrm_website_KLDR_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template hrm_group_hrm_website_KLDR_ 1 hrm_group_hrm_website_KLDR:5000 check resolvers docker init-addr none

