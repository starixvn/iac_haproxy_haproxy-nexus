

backend nexus_chatbot_ncb_main_KLDR_be
    option forwardfor
    cookie serverid insert
    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    server-template chatbot_ncb_main_KLDR_ 1 chatbot_ncb_main_KLDR:5000 check resolvers docker init-addr none

